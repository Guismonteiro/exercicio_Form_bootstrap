<main class="flex-grow-1">
  <section class="py-5 bg-light" id="contato">
            <div class="container">
            <h2 class="text-center mb-4">Fale Conosco</h2>
            <div class="row justify-content-center">
                <div class="col-md-6 ">
                    <form>
                        <div class="mb-3">
                            <label for="nome" style="font-weight: bold;" class="form-label">Nome</label>
                            <input type="nome" name="nome" class="form-control form-control-sm ">
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" style="font-weight: bold;" class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control form-control-sm ">
                        </div>
        
                        <div class="mb-3">
                            <label for="telefone" style="font-weight: bold;" class="form-label">Telefone</label>
                            <input type="tel" name="telefone" class="form-control form-control-sm ">
                        </div>
        
                        <div class="mb-3">
                            <label for="nome" style="font-weight: bold;" class="form-label">Mensagem</label>
                            <textarea name="mensagem" id="mensagem" rows="4" class="form-control form-control-sm"></textarea>
                        </div>
        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary px-4">
                            <span style="font-weight: bold;" id="textoBotao">Enviar Mensagem</span>
                            <span id="spinnerBotao" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                        </button>
                        </div>    
                    </div>
                    </form>
                </div>
            </div>
    </section>
